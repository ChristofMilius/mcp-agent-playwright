[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[project]
name = "mcp-agent-playwright"
version = "0.1.0"
description = "Model Context Protocol server that drives a Playwright browser for LM Studio agents"
authors = [
    { name = "ChristofMilius" }
]
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2",
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcp-agent-playwright = "mcp_agent_playwright.server:main"

[tool.setuptools.packages.find]
where = ["src"]