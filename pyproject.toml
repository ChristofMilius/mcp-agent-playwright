[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-playwright"
version = "0.1.0"
description = "Model Context Protocol server that drives a Playwright browser for LM Studio agents"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2",
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcp-playwright = "mcp_playwright.server:main"

[tool.setuptools.packages.find]
where = ["src"]