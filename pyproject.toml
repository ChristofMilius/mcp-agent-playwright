[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[project]
name = "mcp-agent-playwright"
version = "0.1.0"
description = "Model Context Protocol server that drives a Playwright browser for LM Studio agents"
authors = [
    { name = "ChristofMilius" }
]
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2",
    "playwright>=1.45",
]

[dependency-groups]
# Contributor tooling. A dependency group (PEP 735), not an optional
# extra: `uv run` installs groups by default but ignores extras, so the
# README's `uv run ruff check .` / `uv run pytest -q` only resolve here.
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pyright>=1.1.400", "ruff>=0.16"]

[project.scripts]
mcp-agent-playwright = "mcp_agent_playwright.server:main"

[tool.setuptools.packages.find]
where = ["src"]

# Point pyright at the project venv. Without this it resolves third-party
# imports against the system Python and reports every one of them as missing,
# which buries the findings that matter.
[tool.pyright]
venvPath = "."
venv = ".venv"
# Setting `venv` fixes library resolution but not the language version:
# pyright still fell back to the `python` on PATH (3.11) instead of the
# venv's 3.14, and rejected valid 3.12+ syntax. Pin it to match
# .python-version.
pythonVersion = "3.14"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The session-scoped Chromium fixture can only be driven from the same event
# loop the tests run on, so pin both to the session scope.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "browser: needs a Playwright browser binary; skipped when none is installed",
]
